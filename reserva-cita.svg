<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <defs>
    <style>
      .frame { fill: #f5f7fa; stroke: #cbd5e1; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1.5; }
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1f2937; }
      .section { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #374151; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #374151; }
      .muted { font-family: Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
      .day-header { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #64748b; }
      .day { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .day-selected { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .btn { fill: #2563eb; rx: 6; }
      .btn-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <!-- Fondo exterior -->
  <rect class="frame" x="0" y="0" width="800" height="620" rx="10" />

  <!-- Barra superior -->
  <text class="title" x="24" y="40">Clínica Dental Sonrisa</text>
  <rect class="btn" x="696" y="14" width="80" height="30" />
  <text class="btn-text" x="736" y="34" text-anchor="middle">Ingresar</text>
  <line x1="0" y1="58" x2="800" y2="58" stroke="#cbd5e1" stroke-width="2" />

  <!-- Caja Calendario -->
  <rect class="card" x="20" y="80" width="400" height="320" rx="8" />
  <text class="section" x="220" y="112" text-anchor="middle">Agosto 2026</text>

  <!-- Cabecera de días -->
  <text class="day-header" x="45"  y="140" text-anchor="middle">L</text>
  <text class="day-header" x="95"  y="140" text-anchor="middle">M</text>
  <text class="day-header" x="145" y="140" text-anchor="middle">M</text>
  <text class="day-header" x="195" y="140" text-anchor="middle">J</text>
  <text class="day-header" x="245" y="140" text-anchor="middle">V</text>
  <text class="day-header" x="295" y="140" text-anchor="middle">S</text>
  <text class="day-header" x="345" y="140" text-anchor="middle">D</text>

  <!-- Semana 1 -->
  <text class="day" x="295" y="170" text-anchor="middle">1</text>
  <text class="day" x="345" y="170" text-anchor="middle">2</text>
  <!-- Semana 2 -->
  <text class="day" x="45"  y="200" text-anchor="middle">3</text>
  <text class="day" x="95"  y="200" text-anchor="middle">4</text>
  <text class="day" x="145" y="200" text-anchor="middle">5</text>
  <text class="day" x="195" y="200" text-anchor="middle">6</text>
  <text class="day" x="245" y="200" text-anchor="middle">7</text>
  <text class="day" x="295" y="200" text-anchor="middle">8</text>
  <text class="day" x="345" y="200" text-anchor="middle">9</text>
  <!-- Semana 3 -->
  <text class="day" x="45"  y="230" text-anchor="middle">10</text>
  <text class="day" x="95"  y="230" text-anchor="middle">11</text>
  <text class="day" x="145" y="230" text-anchor="middle">12</text>
  <circle cx="195" cy="225" r="15" fill="#2563eb" />
  <text class="day-selected" x="195" y="230" text-anchor="middle">13</text>
  <text class="day" x="245" y="230" text-anchor="middle">14</text>
  <text class="day" x="295" y="230" text-anchor="middle">15</text>
  <text class="day" x="345" y="230" text-anchor="middle">16</text>
  <!-- Semana 4 -->
  <text class="day" x="45"  y="260" text-anchor="middle">17</text>
  <text class="day" x="95"  y="260" text-anchor="middle">18</text>
  <text class="day" x="145" y="260" text-anchor="middle">19</text>
  <text class="day" x="195" y="260" text-anchor="middle">20</text>
  <text class="day" x="245" y="260" text-anchor="middle">21</text>
  <text class="day" x="295" y="260" text-anchor="middle">22</text>
  <text class="day" x="345" y="260" text-anchor="middle">23</text>
  <!-- Semana 5 -->
  <text class="day" x="45"  y="290" text-anchor="middle">24</text>
  <text class="day" x="95"  y="290" text-anchor="middle">25</text>

  <!-- Caja Horarios -->
  <rect class="card" x="440" y="80" width="340" height="320" rx="8" />
  <text class="section" x="460" y="112">Horarios</text>

  <!-- 08:00 -->
  <circle cx="466" cy="150" r="9" fill="none" stroke="#94a3b8" stroke-width="2" />
  <text class="label" x="486" y="155">08:00</text>
  <!-- 09:00 ocupado -->
  <circle cx="466" cy="190" r="9" fill="none" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="486" y="195">09:00</text>
  <text class="muted" x="620" y="195">ocupado</text>
  <!-- 10:00 seleccionada -->
  <circle cx="466" cy="230" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2" />
  <circle cx="466" cy="230" r="3.5" fill="#ffffff" />
  <text class="label" x="486" y="235" font-weight="bold" fill="#2563eb">10:00</text>
  <!-- 11:00 -->
  <circle cx="466" cy="270" r="9" fill="none" stroke="#94a3b8" stroke-width="2" />
  <text class="label" x="486" y="275">11:00</text>
  <!-- 14:00 ocupado -->
  <circle cx="466" cy="310" r="9" fill="none" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="486" y="315">14:00</text>
  <text class="muted" x="620" y="315">ocupado</text>

  <!-- Caja Sus datos -->
  <rect class="card" x="20" y="420" width="760" height="130" rx="8" />
  <text class="section" x="40" y="452">Sus datos</text>

  <text class="label" x="40" y="488">Nombre</text>
  <rect x="140" y="474" width="560" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" />

  <text class="label" x="40" y="520">Email</text>
  <rect x="140" y="506" width="560" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" />

  <text class="label" x="40" y="552">Teléfono</text>
  <rect x="140" y="538" width="560" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" />

  <!-- Botón Confirmar reserva -->
  <rect class="btn" x="620" y="570" width="160" height="36" />
  <text class="btn-text" x="700" y="593" text-anchor="middle">Confirmar reserva</text>
</svg>
